<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>櫻熊接橘子｜乘法大挑戰</title><style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;color:#382d30;background:#fff8e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#fff3c5,transparent 32%),#fff8e9}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #36786e;outline-offset:3px}.top{max-width:1180px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:15px;letter-spacing:2px;font-weight:900;color:#ad612e}.badge{border:1px solid #e5d8be;border-radius:99px;background:#fffdfa;padding:8px 15px;font-size:13px;color:#7a6854;font-weight:bold}.layout{max-width:1180px;margin:auto;padding:8px 24px 40px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:26px}.sidebar{padding:14px 0}.eyebrow{color:#d5813d;font-size:13px;letter-spacing:3px;font-weight:900}.sidebar h1{font-size:clamp(34px,4vw,52px);line-height:1.14;letter-spacing:-2px;margin:14px 0}.sidebar h1 em{font-style:normal;color:#e57d34}.lead{font-size:16px;color:#78695b;line-height:1.8}.level-title{font-size:14px;font-weight:900;margin:28px 0 12px}.levels{display:grid;grid-template-columns:1fr 1fr;gap:9px}.level{border:1px solid #eadcc7;border-radius:15px;background:#fffdfa;text-align:left;padding:12px;color:#564838;transition:.15s}.level strong{display:block;color:#bd6b31;font-size:13px;margin-bottom:5px}.level span{font-size:13px;white-space:nowrap}.level.active{background:#ffead1;border:2px solid #e8833e;padding:11px;box-shadow:0 3px 0 #f3cba4}.rules{font-size:13px;line-height:1.8;color:#897b6b;margin-top:20px}.game-shell{background:#fffdfa;border:1px solid #ecdfc9;padding:12px;border-radius:26px;box-shadow:0 20px 50px #b9905a24}.hud{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 12px 14px;flex-wrap:wrap}.problem{font-size:clamp(24px,4vw,36px);font-weight:900;letter-spacing:1px}.problem span{color:#e1792f}.progress{color:#796452;font-weight:bold;font-size:14px;white-space:nowrap}.dots{color:#ec8c3c;letter-spacing:3px;font-size:17px}.board{position:relative;height:min(68vh,620px);min-height:430px;border-radius:18px;overflow:hidden;background:linear-gradient(#bce4d1,#e0f1d5 68%,#b8d98b 68%,#b8d98b);touch-action:none;user-select:none}.board:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 17% 15%,#fff9 0 23px,transparent 24px),radial-gradient(circle at 20% 14%,#fff9 0 30px,transparent 31px),radial-gradient(circle at 78% 16%,#fff8 0 25px,transparent 26px),radial-gradient(circle at 82% 15%,#fff8 0 33px,transparent 34px);pointer-events:none}canvas{width:100%;height:100%;position:absolute;inset:0;display:block}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#30443d66;padding:18px}.overlay.hidden{display:none}.modal{background:#fffdf4;border:3px solid #fff;border-radius:25px;padding:26px 28px;max-width:390px;text-align:center;box-shadow:0 16px 50px #3c4b3c50}.modal .icon{font-size:48px}.modal h2{font-size:28px;margin:6px 0 10px}.modal p{color:#79695b;line-height:1.7;margin:0 0 18px}.btn{border:0;border-radius:13px;padding:14px 22px;font-weight:900;background:#ed8b3d;color:white;box-shadow:0 4px 0 #c76826}.btn.secondary{background:#e8f1dc;color:#4b7054;box-shadow:0 4px 0 #bdceac}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 10px 4px}.message{font-size:15px;color:#716352;font-weight:bold;min-height:24px}.controls button{border:0;background:#f4eddf;color:#6c5847;border-radius:10px;padding:9px 13px;font-weight:bold}.move{display:none;justify-content:center;gap:14px;padding:12px}.move button{width:110px;border:0;border-radius:14px;padding:10px;background:#e9f2dc;color:#4b7054;font-size:25px;font-weight:bold}@media(max-width:760px){.top{padding:16px}.layout{display:flex;flex-direction:column;padding:0 14px 25px;gap:10px}.sidebar{padding:0 3px}.sidebar h1{font-size:34px;margin:8px 0}.lead{margin:8px 0}.level-title{margin:15px 0 8px}.levels{grid-template-columns:repeat(3,1fr);gap:6px}.level{padding:8px}.level.active{padding:7px}.level span{font-size:11px}.rules{margin:10px 0}.board{height:53vh;min-height:340px}.move{display:flex}.game-shell{padding:8px}.hud{padding:5px 7px 9px}.badge{display:none}}
</style></head><body><header class="top"><div class="brand">✿ 櫻熊的數學果園</div><div class="badge">邊玩邊練 × 快樂學乘法</div></header><main class="layout"><aside class="sidebar"><div class="eyebrow">BEAR'S ORANGE ORCHARD</div><h1>櫻熊接橘子<br><em>乘法大挑戰！</em></h1><p class="lead">幫櫻熊算出答案，抱著籃子接住正確的橘子。收集8顆，就能完成挑戰！</p><div class="level-title">選擇挑戰等級</div><div class="levels" id="levels"></div><p class="rules">👆 點畫面或拖曳，讓櫻熊左右移動。<br>🍊 接住正確的積；答錯可以再試。<br>✨ 同一等級的題目在本次遊玩不重複。<br>💣 炸彈藏在橘子中！接到會扣1顆。<br>⌨️ 也可以使用鍵盤 ← → 控制。</p></aside><section class="game-shell" aria-label="遊戲區"><div class="hud"><div class="problem" id="problem">準備好出發了嗎？</div><div class="progress"><span id="count">0 / 8</span> <span class="dots" id="dots">○○○○○○○○</span></div></div><div class="board" id="board"><canvas id="canvas" aria-label="橘子接取遊戲畫面"></canvas><div class="overlay" id="overlay"><div class="modal"><div class="icon" id="modalIcon">🍊</div><h2 id="modalTitle">準備好接橘子了嗎？</h2><p id="modalText">先選擇等級，再點畫面控制櫻熊，接住正確的答案！</p><div class="actions"><button class="btn" id="start">開始挑戰</button></div></div></div></div><div class="move"><button id="left" aria-label="櫻熊向左移動">◀</button><button id="right" aria-label="櫻熊向右移動">▶</button></div><div class="footer"><div class="message" id="message" role="status" aria-live="polite">選好等級，出發吧！</div><div class="controls"><button id="pause">暫停</button> <button id="restart">重新開始</button></div></div></section></main><script>
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d'),board=$('board'),bear=new Image();bear.src='bear.png';
const levels=[{label:'個位數 × 個位數',a:[1,9],b:[1,9]},{label:'十位數 × 個位數',a:[10,99],b:[1,9]},{label:'百位數 × 個位數',a:[100,999],b:[1,9]},{label:'千位數 × 個位數',a:[1000,9999],b:[1,9]},{label:'十位數 × 十位數',a:[10,99],b:[10,99]},{label:'百位數 × 十位數',a:[100,999],b:[10,99]}];let level=0,score=0,running=false,paused=false,items=[],a=0,b=0,answer=0,x=0.5,target=.5,last=0,delay=0,w=0,h=0,keys={},seen=levels.map(()=>new Set()),celebration=null;
const rand=(lo,hi)=>Math.floor(Math.random()*(hi-lo+1))+lo;
function drawLevels(){ $('levels').innerHTML='';levels.forEach((l,i)=>{let button=document.createElement('button');button.className='level'+(i===level?' active':'');button.innerHTML=`<strong>LEVEL ${String(i+1).padStart(2,'0')}</strong><span>${l.label}</span>`;button.setAttribute('aria-pressed',String(i===level));button.onclick=()=>{level=i;drawLevels();stop();$('start').style.display='';$('modalIcon').textContent='🍊';$('modalTitle').textContent=`第 ${i+1} 等級`; $('modalText').textContent=`${l.label}。接住8顆正確答案的橘子就過關！`;$('start').textContent='開始挑戰';$('overlay').classList.remove('hidden');$('message').textContent='已選擇第 '+(i+1)+' 等級';};$('levels').append(button)})}
function resize(){const r=board.getBoundingClientRect();w=r.width;h=r.height;const d=window.devicePixelRatio||1;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);
function updateScore(){$('count').textContent=score+' / 8';$('dots').textContent='●'.repeat(score)+'○'.repeat(8-score)}
function pairKey(aa,bb){return (level===0||level===4)?Math.min(aa,bb)+','+Math.max(aa,bb):aa+','+bb}
function newQuestion(){const l=levels[level],used=seen[level];let found=false;for(let i=0;i<100&&!found;i++){a=rand(...l.a);b=rand(...l.b);found=!used.has(pairKey(a,b))}if(!found){outer:for(let aa=l.a[0];aa<=l.a[1];aa++)for(let bb=l.b[0];bb<=l.b[1];bb++){if(!used.has(pairKey(aa,bb))){a=aa;b=bb;found=true;break outer}}}if(!found){stop();$('modalIcon').textContent='🎉';$('modalTitle').textContent='這個等級的題目都玩過了！';$('modalText').textContent='請選擇其他等級；重新整理頁面即可重新開始這個等級的題庫。';$('start').style.display='none';$('overlay').classList.remove('hidden');return}used.add(pairKey(a,b));answer=a*b;$('problem').innerHTML=`${a} × ${b} ＝ <span>？</span>`;items=[];delay=.5}
function newWave(){const vals=new Set([answer]);while(vals.size<3){let n=Math.max(0,answer+rand(-Math.max(5,b*4),Math.max(5,b*4)));if(n!==answer)vals.add(n)}let pool=[...vals].map(value=>({value,bomb:false}));pool.push({value:'💣',bomb:true});pool.sort(()=>Math.random()-.5);const radius=Math.min(38,Math.max(28,w/14));const slots=[.15,.38,.62,.85].sort(()=>Math.random()-.5);items=pool.map((v,i)=>({...v,x:slots[i]*w,y:-radius-6,r:radius,speed:Math.max(48,Math.min(82,h*.12))}));}
function stop(){running=false;paused=false;celebration=null;items=[];$('pause').textContent='暫停'}
function start(){celebration=null;score=0;x=target=.5;updateScore();running=true;paused=false;last=0;$('pause').textContent='暫停';$('overlay').classList.add('hidden');$('message').textContent='找到乘法的積，點畫面移動櫻熊！';newQuestion()}
function catchItem(item){if(item.bomb){score=Math.max(0,score-1);updateScore();$('message').textContent='哎呀，接到炸彈！扣1顆，再試一次。';newQuestion();return}if(item.value!==answer){$('message').textContent='這顆不是答案，先算一算，再試一次！';items=items.filter(v=>v!==item);return}score++;updateScore();$('message').textContent=`答對了！${a} × ${b} ＝ ${answer}，得到1顆橘子！`;if(score===8){running=false;items=[];celebration={start:performance.now(),baseX:x};$('message').textContent='太棒了！櫻熊開心地跳起來！';return}newQuestion()}
function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function drawOrange(item){const {x,y,r,value,bomb}=item;ctx.save();ctx.shadowColor='#b4652c40';ctx.shadowBlur=8;ctx.shadowOffsetY=4;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='#f99936';ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=3;ctx.strokeStyle='#df7c25';ctx.stroke();ctx.fillStyle='#66a95b';ctx.beginPath();ctx.ellipse(x+5,y-r+3,10,5,-.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#55351f';ctx.font=`900 ${bomb?Math.round(r*1.30):Math.max(11,Math.min(24,Math.floor(r*1.45/Math.max(2,String(value).length)*1.8)))}px Microsoft JhengHei,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(value),x,y+2,r*1.8);ctx.restore()}
function drawBear(jump=0){let size=Math.min(170,w*.30,h*.34),bx=x*w,by=h-15-jump;ctx.save();ctx.drawImage(bear,bx-size/2,by-size,size,size);let bw=size*.72,bh=size*.24;roundRect(bx-bw/2,by-size*.36,bw,bh,7,'#a96d39');ctx.strokeStyle='#e4b47c';ctx.lineWidth=3;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(bx-bw/2+i*bw/5,by-size*.36+5);ctx.lineTo(bx-bw/2+i*bw/5,by-size*.12-4);ctx.stroke()}ctx.beginPath();ctx.moveTo(bx-bw/2,by-size*.25);ctx.lineTo(bx+bw/2,by-size*.25);ctx.stroke();ctx.restore()}
function drawCelebration(t){const elapsed=(t-celebration.start)/1000;const phase=Math.min(elapsed,7);const jump=phase<3?Math.abs(Math.sin(phase*Math.PI*1.5))*Math.min(95,h*.18):0;drawBear(jump);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.min(23,w*.045)+'px Microsoft JhengHei, sans-serif';roundRect(w*.12,20,w*.76,54,18,'#fffdf3');ctx.fillStyle='#704833';ctx.fillText(phase<2.3?'耶！接到8顆橘子了！':phase<5.5?'哎呀！橘子掉出來了！':'可以再幫櫻熊接橘子嗎？',w/2,47,w*.70);ctx.restore();for(let i=0;i<8;i++){let baseX=celebration.baseX*w;let burst=Math.max(0,phase-2.3);let u=Math.min(1,burst/2.4);let dest=w*(.12+i*.108);let ox=baseX+(dest-baseX)*u;let originY=h-Math.min(170,w*.30,h*.34)*.38-15;let arc=Math.sin(u*Math.PI)*(35+(i%3)*17);let oy=originY+(h-27-originY)*u-arc;if(phase>=2.3)drawOrange({x:ox,y:oy,r:Math.min(22,w*.032),value:'',bomb:false})}if(elapsed>=7){celebration=null;$('modalIcon').textContent='🍊';$('modalTitle').textContent='哎呀！橘子掉出來了';$('modalText').textContent='櫻熊太開心跳起來，橘子都掉到地上了！可以再幫忙接橘子嗎？';$('start').textContent='再幫櫻熊一次';$('start').style.display='';$('overlay').classList.remove('hidden');$('message').textContent='謝謝你幫助櫻熊，再挑戰一次吧！'}}
function tick(t){let dt=last?Math.min(.04,(t-last)/1000):0;last=t;ctx.clearRect(0,0,w,h);if(running&&!paused){if(keys.ArrowLeft)target-=dt*.8;if(keys.ArrowRight)target+=dt*.8;target=Math.min(.9,Math.max(.1,target));x+=(target-x)*Math.min(1,dt*10);if(!items.length){delay-=dt;if(delay<=0)newWave()}for(const item of [...items]){item.y+=item.speed*dt;const basketY=h-Math.min(170,w*.30,h*.34)*.36-15;if(item.y+item.r>=basketY&&item.y-item.r<=basketY+18&&Math.abs(item.x-x*w)<Math.min(170,w*.30,h*.34)*.36+item.r*.4){catchItem(item);break}}if(items.length&&items.every(v=>v.y-v.r>h)){items=[];delay=.4;$('message').textContent='沒接到也沒關係，再試一次！'}}items.forEach(drawOrange);if(bear.complete&&bear.naturalWidth){if(celebration)drawCelebration(t);else drawBear()}requestAnimationFrame(tick)}
function pointer(e){const r=board.getBoundingClientRect();target=Math.min(.9,Math.max(.1,(e.clientX-r.left)/r.width))}board.addEventListener('pointerdown',e=>{if(!running||paused)return;board.setPointerCapture(e.pointerId);pointer(e)});board.addEventListener('pointermove',e=>{if(running&&!paused&&e.buttons)pointer(e)});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});window.addEventListener('keyup',e=>keys[e.key]=false);function moveButton(id,dir){let button=$(id);button.addEventListener('pointerdown',e=>{e.preventDefault();if(running&&!paused){target=Math.max(.1,Math.min(.9,target+dir*.18));keys[dir<0?'ArrowLeft':'ArrowRight']=true;button.setPointerCapture(e.pointerId)}});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>button.addEventListener(ev,()=>keys[dir<0?'ArrowLeft':'ArrowRight']=false))}moveButton('left',-1);moveButton('right',1);
$('start').onclick=start;$('restart').onclick=start;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'繼續':'暫停';$('message').textContent=paused?'遊戲暫停中。':'繼續挑戰！'};drawLevels();resize();updateScore();requestAnimationFrame(tick);
</script></body></html>
